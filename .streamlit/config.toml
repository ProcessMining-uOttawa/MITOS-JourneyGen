# No [server] port here: a fixed port stops the app from starting on
# Streamlit Community Cloud. To run it locally on another port than the
# default 8501, use run_local.cmd or run_local.sh.

# Two themes, so that the viewer can choose: the menu at the top right, then
# Settings. The accent is the blue of the Greek flag, lighter on dark so that
# it still reads.
[theme.light]
primaryColor = "#0D5EAF"

[theme.dark]
primaryColor = "#5AA9F0"
