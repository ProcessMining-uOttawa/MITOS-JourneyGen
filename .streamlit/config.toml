# Streamlit's default port, 8501, is often taken by another app (PM4Py-UCM
# for one). A --server.port on the command line overrides this.
[server]
port = 8612

# Two themes, so that the viewer can choose: the menu at the top right, then
# Settings. The accent is the blue of the Greek flag, lighter on dark so that
# it still reads.
[theme.light]
primaryColor = "#0D5EAF"

[theme.dark]
primaryColor = "#5AA9F0"
