name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.13"}
          # the generator promises the same bytes on every platform
          - {os: windows-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install -r requirements.txt pytest pytest-cov

      - name: The command line generates CSV and XES
        run: python generate.py --citizens 200 --seed 1 --format both --gzip --out smoke_out

      - name: Tests, with coverage
        # .coveragerc says what is measured; below 85% the job fails
        run: python -m pytest tests -q -rs --cov --cov-report=term --cov-fail-under=85

  security:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install bandit

      - name: Bandit
        # bandit.yaml says what is scanned; any finding fails the job
        run: python -m bandit -r . -c bandit.yaml
